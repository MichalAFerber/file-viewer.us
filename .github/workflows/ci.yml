name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: Headless-Chromium harness (real CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # FULL tree, deliberately not --omit=dev (§15): the dev half is the toolchain, and its output is what ships.
      - name: Dependency audit (§15)
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run harness under the deployed CSP
        run: node test/harness.mjs
